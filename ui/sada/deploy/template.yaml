AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Fair Trade Exchange sample UI (ui/sada): the Django app as one Lambda behind a public function URL.
  Deployed by ui/sada/deploy/deploy.sh. No database (signed-cookie sessions); static files served by WhiteNoise.

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket holding the Lambda zip (created by deploy.sh)
  CodeKey:
    Type: String
    Description: Key of the Lambda zip (new per build, so CloudFormation sees the change)
  DataSource:
    Type: String
    Default: mock
    AllowedValues: [mock, live]
    Description: What a new browser session answers from (the chat's switch can still change it)
  FexApiUrl:
    Type: String
    Default: ""
    Description: The Fair Exchange chat API (FairExchange stack output ApiUrl). Empty keeps Real API mode off
  DemoPasscodeSecretArn:
    Type: String
    Default: ""
    Description: The chat API's demo passcode secret (FairExchange stack output DemoPasscodeSecretArn)
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  HasPasscode: !Not [!Equals [!Ref DemoPasscodeSecretArn, ""]]

Resources:
  DjangoSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Django SECRET_KEY for the Fair Trade Exchange sample UI (signs session and CSRF cookies)
      GenerateSecretString:
        PasswordLength: 64
        ExcludeCharacters: "\"'\\"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-web
      RetentionInDays: !Ref LogRetentionDays

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs-and-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasPasscode
                  - [!Ref DjangoSecretKey, !Ref DemoPasscodeSecretArn]
                  - [!Ref DjangoSecretKey]

  Web:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-web
      Description: Fair Trade Exchange sample UI (Django via apig-wsgi)
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt Role.Arn
      MemorySize: 1024
      # A Real API answer turn waits for the agent (FEX_API_TIMEOUT, 300 s); leave headroom for the rest.
      Timeout: 330
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY_SECRET_ARN: !Ref DjangoSecretKey
          DATA_SOURCE: !Ref DataSource
          FEX_API_URL: !Ref FexApiUrl
          FEX_DEMO_PASSCODE_SECRET_ARN: !Ref DemoPasscodeSecretArn
          FEX_API_TIMEOUT: "300"
          USE_LIVE_WEATHER: "1"
          USE_BEDROCK: "0"

  WebUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Web
      AuthType: NONE

  # A public function URL needs both permissions: invoking the URL, and invoking the function through it.
  WebUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Web
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  WebInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Web
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  SampleUiUrl:
    Description: The sample UI
    Value: !GetAtt WebUrl.FunctionUrl
  FunctionName:
    Value: !Ref Web
  LogGroupName:
    Value: !Ref LogGroup
