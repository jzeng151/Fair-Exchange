AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Fair Trade Exchange sample UI (ui/sada): the Django app as one Lambda behind a public function URL.
  Deployed by ui/sada/deploy/deploy.sh. No database (signed-cookie sessions); static files served by WhiteNoise.

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket holding the Lambda zip (created by deploy.sh)
  CodeKey:
    Type: String
    Description: Key of the Lambda zip (new per build, so CloudFormation sees the change)
  DataSource:
    Type: String
    Default: mock
    AllowedValues: [mock, live]
    Description: What a new browser session answers from (the chat's switch can still change it)
  FexApiUrl:
    Type: String
    Default: ""
    Description: The Fair Exchange chat API (FairExchange stack output ApiUrl). Empty keeps Real API mode off
  DemoPasscodeSecretArn:
    Type: String
    Default: ""
    Description: The chat API's demo passcode secret (FairExchange stack output DemoPasscodeSecretArn)
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  HasPasscode: !Not [!Equals [!Ref DemoPasscodeSecretArn, ""]]

Resources:
  DjangoSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Django SECRET_KEY for the Fair Trade Exchange sample UI (signs session and CSRF cookies)
      GenerateSecretString:
        PasswordLength: 64
        ExcludeCharacters: "\"'\\"

  # Voice notes (Amazon Transcribe) and attachments (read with Claude on Bedrock). Private; objects expire after a day.
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire
            Status: Enabled
            ExpirationInDays: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-web
      RetentionInDays: !Ref LogRetentionDays

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs-and-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasPasscode
                  - [!Ref DjangoSecretKey, !Ref DemoPasscodeSecretArn]
                  - [!Ref DjangoSecretKey]
        - PolicyName: aws-tools
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "${UploadsBucket.Arn}/*"
              - Effect: Allow  # list a voice note's files to delete them all (aws_tools.delete_voice_files)
                Action: s3:ListBucket
                Resource: !GetAtt UploadsBucket.Arn
                Condition: { StringLike: { "s3:prefix": "voice/*" } }
              - Effect: Allow
                Action: [polly:SynthesizeSpeech, translate:TranslateText, comprehend:DetectDominantLanguage,
                         transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob, transcribe:DeleteTranscriptionJob]
                Resource: "*"
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-5-5"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-5-5"

  Web:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-web
      Description: Fair Trade Exchange sample UI (Django via apig-wsgi)
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_handler.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt Role.Arn
      MemorySize: 1024
      # A Real API answer turn waits for the agent (FEX_API_TIMEOUT, 300 s); leave headroom for the rest.
      Timeout: 330
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY_SECRET_ARN: !Ref DjangoSecretKey
          DATA_SOURCE: !Ref DataSource
          FEX_API_URL: !Ref FexApiUrl
          FEX_DEMO_PASSCODE_SECRET_ARN: !Ref DemoPasscodeSecretArn
          FEX_API_TIMEOUT: "300"
          USE_LIVE_WEATHER: "1"
          USE_BEDROCK: "0"
          UPLOADS_BUCKET: !Ref UploadsBucket
          VISION_MODEL_ID: us.anthropic.claude-haiku-5-5

  # A Transcribe batch job can't be stopped. When a voice-note request stops waiting before its job finishes, it
  # leaves an "abandoned" marker; this function deletes that note's audio and transcript once the job finishes
  # (exchange/voice_cleanup.py, same code package, no Django).
  VoiceCleanupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-voice-cleanup
      RetentionInDays: !Ref LogRetentionDays

  VoiceCleanupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: voice-cleanup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt VoiceCleanupLogGroup.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: !Sub "${UploadsBucket.Arn}/voice/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt UploadsBucket.Arn
                Condition: { StringLike: { "s3:prefix": "voice/*" } }
              - Effect: Allow
                Action: transcribe:DeleteTranscriptionJob
                Resource: !Sub "arn:aws:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/fx-ui-voice-*"

  VoiceCleanup:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-voice-cleanup
      Description: Deletes abandoned voice-note files once their Transcribe job finishes
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: exchange.voice_cleanup.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt VoiceCleanupRole.Arn
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref VoiceCleanupLogGroup
      Environment:
        Variables:
          UPLOADS_BUCKET: !Ref UploadsBucket

  VoiceJobFinished:
    Type: AWS::Events::Rule
    Properties:
      Description: Finished sample-UI voice-note jobs, for the abandoned-file cleanup
      EventPattern:
        source: [aws.transcribe]
        detail-type: [Transcribe Job State Change]
        detail:
          TranscriptionJobName: [{ prefix: fx-ui-voice- }]
          TranscriptionJobStatus: [COMPLETED, FAILED]
      Targets:
        - Id: voice-cleanup
          Arn: !GetAtt VoiceCleanup.Arn

  VoiceCleanupInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VoiceCleanup
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt VoiceJobFinished.Arn

  WebUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Web
      AuthType: NONE

  # A public function URL needs both permissions: invoking the URL, and invoking the function through it.
  WebUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Web
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  WebInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Web
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  SampleUiUrl:
    Description: The sample UI
    Value: !GetAtt WebUrl.FunctionUrl
  FunctionName:
    Value: !Ref Web
  LogGroupName:
    Value: !Ref LogGroup
