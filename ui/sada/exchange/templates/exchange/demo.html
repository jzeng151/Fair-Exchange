{% extends "exchange/base.html" %}
{% block title %}Demo · Fair Trade Exchange{% endblock %}
{% block body %}
<div class="wrap">
  <div class="page">
    <div class="hero" style="margin-bottom:1rem">
      <h1>Producer Exchange — 8-minute demo</h1>
      <p>Use ← / → to move between slides. Timings total 8 minutes of demo plus a 2-minute Q&amp;A.</p>
    </div>

    <div id="deck"></div>

    <div style="display:flex;gap:.6rem;align-items:center;margin-top:1rem">
      <button class="btn-ghost" id="prev">← Back</button>
      <button class="btn-ghost" id="next">Next →</button>
      <span class="footnote" id="progress"></span>
      <a class="btn" style="margin-left:auto" href="{% url 'picker' %}">Open the live chat</a>
    </div>
  </div>
</div>

<script>
const slides = [
  { t: "The gap we're closing", m: "0:45", b: [
    "Producers generate valuable evidence — climate, social, economic — but rarely see data come back to them in a usable form.",
    "Fair Trade USA learns what producers faced only secondhand, inferred from what they chose to fund.",
    "The Exchange returns data to the producer and captures their stated challenge, in their own words."]},
  { t: "What a producer gets back", m: "1:00", b: [
    "They describe a challenge openly — drought, falling prices, labor, soil.",
    "Two things come back: what the data shows for their crop and region, and what peers have tried.",
    "Enablement, not direction. The decision stays with the producer and cooperative."]},
  { t: "Live: start a conversation", m: "1:30", b: [
    "No sign-on — a friendly, made-up profile greets the visitor by name.",
    "Switch profile: producer, consumer, supplier — each with its own history.",
    "Type or speak a concern (microphone). Answers can be read aloud."]},
  { t: "Live: a grounded answer", m: "1:30", b: [
    "Ask about water or price. The answer carries citations: regional data, a peer Premium project, a standard clause.",
    "Phrased as options to weigh, ending by handing the decision back.",
    "Alternative follow-up questions keep it simple and quick."]},
  { t: "Guardrails and trust", m: "1:15", b: [
    "Out-of-scope asks get a gentle redirect, not an answer.",
    "Personal details are flagged for human review — never auto-redacted. Authentic voice is preserved.",
    "Every claim is traceable to a source; the conversation can be summarized into a record."]},
  { t: "Multilingual", m: "0:45", b: [
    "Switch language in the chat; new answers follow it.",
    "Spanish is the confirmed focus language; the prototype also offers French, Portuguese, Kiswahili, Hindi.",
    "Voice input and read-aloud follow the chosen language."]},
  { t: "How it becomes real", m: "1:00", b: [
    "The UI calls a mock /api/chat today; request/response shapes match the real API.",
    "Swap one function to wire the Strands agent on Amazon Bedrock AgentCore, with Bedrock Guardrails.",
    "Model access goes only through Amazon Bedrock; scope is enforced in tools from session context."]},
  { t: "Q&A — 2 minutes", m: "2:00", b: [
    "Likely: Is any data real? No — all fictitious/synthetic for this PoC.",
    "Likely: How does consent work? Producers own and consent; a decline is a recorded success.",
    "Likely: Why suggestion tone? Producer agency is the whole point; the system never commands."]},
];
let i = 0;
const deck = document.getElementById("deck");
const progress = document.getElementById("progress");
function render() {
  const s = slides[i];
  deck.innerHTML = `<div class="card card-pad"><div class="footnote">Slide ${i+1} of ${slides.length} · suggested ${s.m}</div>
    <h2 style="color:var(--teal-700);margin:.3rem 0 1rem">${s.t}</h2>
    <ul style="font-size:1.1rem;line-height:1.7">${s.b.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  let total = 0; slides.forEach(sl => { const [mm,ss]=sl.m.split(":").map(Number); total += mm*60+ss; });
  progress.textContent = `Total ${Math.floor(total/60)}:${String(total%60).padStart(2,"0")} (8 min demo + 2 min Q&A)`;
}
document.getElementById("next").onclick = () => { i = Math.min(i+1, slides.length-1); render(); };
document.getElementById("prev").onclick = () => { i = Math.max(i-1, 0); render(); };
document.addEventListener("keydown", e => { if (e.key==="ArrowRight") document.getElementById("next").click(); if (e.key==="ArrowLeft") document.getElementById("prev").click(); });
render();
</script>
{% endblock %}
