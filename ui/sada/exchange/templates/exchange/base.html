{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fair Exchange{% endblock %}</title>
  <meta name="description" content="Fair Trade USA Producer Exchange — a friendly, grounded conversation that returns evidence and peer examples to producers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22.5' fill='%23313D7F' stroke='%2393D73B' stroke-width='3'/%3E%3Ctext x='24' y='29' text-anchor='middle' fill='white' font-family='Arial' font-size='14'%3EFEX%3C/text%3E%3C/svg%3E">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{% url 'picker' %}" style="text-decoration:none">
      <svg class="fex-mark" width="38" height="38" viewBox="0 0 48 48" role="img" aria-label="FEX"><circle cx="24" cy="24" r="22.5" fill="#313D7F"/><circle cx="24" cy="24" r="22.5" fill="none" stroke="#93D73B" stroke-width="3"/><text x="24" y="29" text-anchor="middle" fill="#FFFFFF" font-family="Rubik, Arial, sans-serif" font-weight="500" font-size="14" letter-spacing="0.5">FEX</text></svg>
      <span>Fair Exchange <span class="brand-by">for Fair Trade USA</span> <small>Talk with FEX · proof of concept</small></span>
    </a>
    <nav class="nav">
      <a href="{% url 'picker' %}" class="{% if request.resolver_match.url_name == 'picker' or request.resolver_match.url_name == 'chat' %}active{% endif %}">Chat</a>
      <a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>
      <a href="{% url 'docs' %}" class="{% if request.resolver_match.url_name == 'docs' %}active{% endif %}">Docs</a>
      <a href="{% url 'demo' %}" class="{% if request.resolver_match.url_name == 'demo' %}active{% endif %}">Demo</a>
    </nav>
  </header>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
