name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Scaffold checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12'
      # Repo-wide problems no package's tests can see: duplicate JSON keys, packages whose tests
      # CI doesn't run, committed iCloud duplicates. See scripts/ci/check_repo.py.
      - name: Repo guard
        run: |
          uv run --no-project --with pytest==8.4.2 python -m pytest -q -p no:cacheprovider scripts/ci
          python3 scripts/ci/check_repo.py
      - name: Handoff docs checks
        run: |
          python3 docs/handoff/check_links.py
          python3 docs/handoff/check_open_decisions.py
      - name: Agent tests
        working-directory: agent
        run: |
          uv sync --locked
          uv run --no-sync pytest
          uv run --no-sync pytest ../eval/tests
      - name: Data tests
        working-directory: data
        run: |
          uv sync --locked
          uv run --no-sync pytest
      - name: Sync tests
        working-directory: sync
        run: |
          uv sync --locked
          uv run --no-sync pytest
      # Regenerate the record and contract schemas/types from the Pydantic models and fail on any
      # difference, with a clear fix. Catches a PR that changed models.py without regenerating.
      - name: Generated files are up to date
        working-directory: agent
        run: |
          uv run --no-sync python scripts/generate_types.py
          if ! git diff --exit-code -- schema ../api/src/types; then
            echo "::error::Generated schema/types are stale. Merge main, then run: cd agent && uv run python scripts/generate_types.py"
            exit 1
          fi
      - name: Generated record types compile
        run: npx --yes -p typescript@5.6.3 tsc --noEmit --strict api/src/types/*.ts
      - name: API type check
        working-directory: api
        run: npm ci && npm run typecheck && npm test
      - name: Web build and type check
        working-directory: web
        run: npm ci && npm run build
      # The real chat API and the real agent run together over HTTP and hold one full conversation
      # (demo model: no AWS). Catches mismatches each side's own tests can't see (#89, #101).
      - name: Local end-to-end conversation
        run: bash scripts/e2e/run_local.sh
      # The stack bundles the chat API's Lambdas from api/ (esbuild), so api/ needs its dependencies first.
      - name: Infrastructure type check and synthesis
        working-directory: infra
        run: |
          (cd ../api && npm ci)
          npm ci
          npx tsc --noEmit
          npx cdk synth --quiet

  # If main itself fails CI (e.g. two PRs merged in an order that broke it), say so loudly:
  # open an issue, or comment on the open one, with a link to the failing run.
  report-main-failure:
    name: Report a failing main
    needs: checks
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Open or update the "main is failing" issue
        run: |
          title="main is failing CI"
          body="CI failed on main at ${COMMIT}: ${RUN_URL}. Fix forward before merging anything else; every PR's CI will fail until main is green."
          existing=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  deploy:
    name: Publish sandbox
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: fair-exchange-sandbox-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_AWS_ACCOUNT: '100300582834'
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Authenticate to sandbox
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: '100300582834'
          role-session-name: GitHub-${{ github.run_id }}
      # Live mode needs the deployed chat API's URL at build time; without the output the live tab is hidden.
      - name: Build website
        working-directory: web
        run: |
          api_url="$(aws cloudformation describe-stacks --stack-name FairExchange \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue | [0]" --output text)"
          [[ "$api_url" == https://* ]] || api_url=""
          npm ci && VITE_FEX_API_URL="$api_url" npm run build
      - name: Publish and verify website
        run: bash infra/publish-web.sh
