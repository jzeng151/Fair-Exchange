# CI for Fair Exchange (issue #10). Runs on every pull request and on pushes to main.
# Each job skips with a notice when its folder doesn't exist yet, and starts running
# automatically once that folder lands (e.g. infra/ with #5).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [agent, data, eval]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the package exists
        id: present
        working-directory: .
        run: |
          if [ -f "${{ matrix.package }}/pyproject.toml" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.package }}/ has no pyproject.toml yet; skipping"
          fi

      - name: Set up uv
        if: steps.present.outputs.yes == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked versions)
        if: steps.present.outputs.yes == 'true'
        run: uv sync --python 3.12 --locked

      - name: Run tests
        if: steps.present.outputs.yes == 'true'
        run: uv run pytest -q

  tsc:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Type-check TypeScript in api/, web/ and infra/
        run: |
          shopt -s globstar nullglob
          checked=0
          for dir in api web infra; do
            [ -d "$dir" ] || continue
            if [ -f "$dir/tsconfig.json" ]; then
              echo "::group::tsc -p $dir"
              if [ -f "$dir/package-lock.json" ]; then (cd "$dir" && npm ci); elif [ -f "$dir/package.json" ]; then (cd "$dir" && npm install); fi
              (cd "$dir" && npx --yes -p typescript@5.6.3 tsc --noEmit -p .)
              echo "::endgroup::"
              checked=1
            else
              files=("$dir"/**/*.ts)
              if [ ${#files[@]} -gt 0 ]; then
                echo "::group::tsc --strict ${files[*]}"
                npx --yes -p typescript@5.6.3 tsc --noEmit --strict "${files[@]}"
                echo "::endgroup::"
                checked=1
              fi
            fi
          done
          if [ "$checked" = 0 ]; then echo "::notice::no TypeScript in api/, web/ or infra/ yet; skipping"; fi

  cdk-synth:
    name: cdk synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check infra/ exists
        id: present
        run: |
          if [ -f infra/cdk.json ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::infra/ has no cdk.json yet (issue #5); skipping"
          fi

      - uses: actions/setup-node@v4
        if: steps.present.outputs.yes == 'true'
        with:
          node-version: 20

      - name: Synthesize the CDK app (no AWS credentials; nothing is deployed)
        if: steps.present.outputs.yes == 'true'
        working-directory: infra
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx cdk synth --quiet
