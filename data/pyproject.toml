[project]
name = "fx-data"
version = "0.1.0"
description = "Fair Exchange data: loaders and lookups built from docs/olena_data"
requires-python = ">=3.12,<3.13"
dependencies = ["openpyxl>=3.1,<4"]

[dependency-groups]
dev = ["pytest>=8,<9"]
# Only the generator's Comprehend step (fx_data.generator) needs AWS; tests and the agent never do.
generator = ["boto3>=1.34,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
