[project]
name = "fex-agent"
version = "0.1.0"
description = "FEX: Fair Exchange's agent. Pydantic models here are the single schema source."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "strands-agents>=1.60,<2",
    "fx-data",
    "boto3>=1.34,<2",
    "amazon-transcribe>=0.6,<0.7",
]

[tool.uv.sources]
fx-data = { path = "../data" }  # regular install: macOS can hide editable .pth files, which Python skips

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "jsonschema>=4.23,<5",
    "strands-agents==1.63.0",
    "bedrock-agentcore==1.25.3",
    "moto[dynamodb]>=5,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
