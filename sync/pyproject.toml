[project]
name = "fex-sync"
version = "0.1.0"
description = "DynamoDB records table to S3 sync for Athena (spec 28)."
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.38,<2"]
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "moto[dynamodb,s3]>=5.1,<6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/fex_sync"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
