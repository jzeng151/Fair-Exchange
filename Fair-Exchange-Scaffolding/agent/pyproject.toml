[project]
name = "fex-agent"
version = "0.1.0"
description = "FEX: Fair Exchange's Strands agent for Amazon Bedrock AgentCore"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents>=1.60,<2",
    "bedrock-agentcore>=1.18,<2",
    "boto3>=1.40",
    "pydantic>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
