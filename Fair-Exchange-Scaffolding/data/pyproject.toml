[project]
name = "fx-data"
version = "0.1.0"
description = "Fair Exchange data loaders: sample data, standards, regional facts"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.40", "pydantic>=2.8,<3", "openpyxl>=3.1", "pyarrow>=17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx_data"]
